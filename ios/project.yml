name: Sunky
options:
  bundleIdPrefix: com.duckyisc00l
  deploymentTarget: { iOS: "14.0" }
targets:
  Sunky:
    type: application
    platform: iOS
    sources:
      - path: App
        excludes: ["Games/**", "Controls/**", "Art/**", "Info.plist"]
      - path: App/Games
        type: folder
        buildPhase: resources
      - path: App/Controls
        type: folder
        buildPhase: resources
      - path: App/Art
        type: folder
        buildPhase: resources
    scheme: {}
    dependencies:
      - sdk: OpenGLES.framework
      - sdk: QuartzCore.framework
      - sdk: AudioToolbox.framework
      - sdk: AVFoundation.framework
      - sdk: GameController.framework
      - sdk: Security.framework
      - sdk: CoreFoundation.framework
      - sdk: CoreAudio.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.duckyisc00l.sunky
        PRODUCT_NAME: Sunky
        INFOPLIST_FILE: App/Info.plist
        INFOPLIST_OUTPUT_FORMAT: XML
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        CLANG_ENABLE_OBJC_ARC: YES
        GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "GLES_SILENCE_DEPRECATION=1"]
        OTHER_LDFLAGS: ["$(inherited)", "-lgm8emulator", "-lbutterscotch", "-lc++", "-lresolv"]
        "LIBRARY_SEARCH_PATHS[sdk=iphoneos*]": ["$(inherited)", "$(PROJECT_DIR)/lib/iphoneos"]
        "LIBRARY_SEARCH_PATHS[sdk=iphonesimulator*]": ["$(inherited)", "$(PROJECT_DIR)/lib/iphonesimulator"]
        DEAD_CODE_STRIPPING: YES
        CODE_SIGNING_ALLOWED: "NO"
        CODE_SIGNING_REQUIRED: "NO"
        CODE_SIGN_IDENTITY: ""
