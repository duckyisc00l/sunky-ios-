name: lab
on:
  workflow_dispatch:
    inputs:
      games: { description: "games to run (blank = all)", required: false, default: "" }
      rooms: { description: "screenshot every room in widescreen (yes/no)", required: false, default: "no" }
permissions: { contents: write }
concurrency: { group: lab, cancel-in-progress: false }
jobs:
  lab:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
      - name: Games cache
        uses: actions/cache@v4
        with:
          path: games
          key: games-v1-${{ hashFiles('ci/games.txt') }}
      - name: Download games from Game Jolt
        run: ci/fetch.sh
      - name: Unpack Sunky the Game 2 installer
        run: |
          sudo apt-get install -y p7zip-full >/dev/null
          mkdir -p games/g2x && 7z x -y -ogames/g2x games/g2.exe >/dev/null && find games/g2x -maxdepth 2 | head -30
      - name: Apt download cache
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-debs-v1
      - name: Install build deps
        timeout-minutes: 20
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          # the default EC2 mirror has been crawling: use Azure's (GitHub's own) and keep the downloads
          sudo sed -i 's#http://[a-z0-9.-]*ec2.archive.ubuntu.com/ubuntu#http://azure.archive.ubuntu.com/ubuntu#g' /etc/apt/sources.list.d/ubuntu.sources /etc/apt/sources.list 2>/dev/null || true
          mkdir -p ~/apt-debs && sudo cp ~/apt-debs/*.deb /var/cache/apt/archives/ 2>/dev/null || true
          A="-o Acquire::http::Timeout=20 -o Acquire::Retries=5 -o DPkg::Lock::Timeout=60"
          echo "updating package lists"; sudo timeout 240 apt-get $A update -q || echo "update gave up; installing from the image's lists"
          echo "installing"; sudo DEBIAN_FRONTEND=noninteractive apt-get $A install -y -q --no-install-recommends xvfb xdotool imagemagick libx11-dev libxcb1-dev libxcb-shape0-dev libxcb-xfixes0-dev libxrandr-dev libxi-dev libgl1-mesa-dev libgl1-mesa-dri libasound2-dev libpulse-dev libjack-jackd2-dev libegl-dev libgles-dev libxcb-xinput0 libxkbcommon0 libxkbcommon-x11-0 libx11-xcb1 pulseaudio | tail -3
          cp /var/cache/apt/archives/*.deb ~/apt-debs/ 2>/dev/null || true
      - name: Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            engine/ogmk/target
            engine/ogmk/target-gles
            ci/gm8info/target
          key: cargo-v2-${{ hashFiles('engine/**/*.rs', 'engine/**/Cargo.*', 'ci/gm8info/**') }}
          restore-keys: cargo-v2-
      - name: Build OpenGMK and gm8info
        run: |
          set -o pipefail
          (cd engine/ogmk && cargo build --release -p gm8emulator --bin gm8emulator --features gles --target-dir target-gles > ../../build.log 2>&1); rc=$?
          grep -E "^error" -A12 build.log | head -150 || true
          [ $rc -eq 0 ] || exit $rc
          ls -la engine/ogmk/target-gles/release/gm8emulator
          (cd ci/gm8info && cargo build --release 2>&1 | tail -5)
      - name: Inspect games
        run: |
          mkdir -p out/info
          for g in p1 p2 p3 mpeg tiff; do
            SPRITES="Title,SunkyStand,Sunky,SunkyDance,SillyTitle,Stand,SunkyFly,Sunky Did a Thing,SUNKY???,Press Enter,HOW2DANCEPARTY,Enter Password,Enter Password 2" \
              SPRITES_ALL="Press Enter,HOW2DANCEPARTY" BACKGROUNDS=1 \
              ci/gm8info/target/release/gm8info games/$g.exe out/info/$g > out/info/$g.log 2>&1 || echo "gm8info failed for $g"
          done
          python3 -c "import PIL" 2>/dev/null || pip install -q --break-system-packages pillow
          python3 ci/rawpng.py out/info
          python3 ci/gen8.py games/g2x/data.win > out/info/g2.txt || true
          cat out/info/g2.txt
      - name: Publish game info to branch r-info
        run: |
          rm -rf /tmp/info && cp -r out/info /tmp/info && cd /tmp/info && git init -q -b r-info && git add -A
          git -c user.name=lab -c user.email=lab@local commit -qm "info ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" r-info

      - name: Run games (virtual screen)
        if: ${{ inputs.rooms != 'yes' }}
        env: { LIBGL_ALWAYS_SOFTWARE: "1" }
        run: |
          pulseaudio --start --exit-idle-time=-1 || true
          pactl load-module module-null-sink >/dev/null 2>&1 || true
          export SUNKY_OVERRIDES=$PWD/ios/App/Art SUNKY_MAX_TEXTURE=4096
          EMU=engine/ogmk/target-gles/release/gm8emulator xvfb-run -a -s "-screen 0 1280x960x24" ci/lab.sh out/run-gles ${{ inputs.games || 'p1 p2 p3 mpeg tiff' }}
          SUNKY_WIDE=2.16 EMU=engine/ogmk/target-gles/release/gm8emulator xvfb-run -a -s "-screen 0 1600x960x24" ci/lab.sh out/run-wide p1 mpeg
      - name: Widescreen sweep of every room with a camera
        if: ${{ inputs.rooms == 'yes' }}
        env: { LIBGL_ALWAYS_SOFTWARE: "1" }
        run: |
          export SUNKY_OVERRIDES=$PWD/ios/App/Art SUNKY_MAX_TEXTURE=4096 SUNKY_WIDE=2.16
          xvfb-run -a -s "-screen 0 1600x960x24" ci/lab-rooms.sh out/info out/rooms ${{ inputs.games || 'p1 p2 p3 mpeg tiff' }}
          python3 ci/sheets.py out/rooms
      - name: Publish results to branch r-lab
        if: always()
        run: |
          cd out && git init -q -b r-lab && git add -A
          git -c user.name=lab -c user.email=lab@local commit -qm "lab ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" r-lab

  g2:
    # Sunky the Game 2 is GameMaker Studio (bytecode 13): Butterscotch, not OpenGMK
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Games cache
        uses: actions/cache@v4
        with:
          path: games
          key: games-v1-${{ hashFiles('ci/games.txt') }}
      - name: Download games
        run: ci/fetch.sh && sudo apt-get install -y -qq p7zip-full >/dev/null && mkdir -p games/g2x && 7z x -y -ogames/g2x games/g2.exe >/dev/null
      - name: Build Butterscotch (SDL2, Linux)
        run: |
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update -qq && sudo apt-get install -y -qq libsdl2-dev xvfb xdotool imagemagick libgl1-mesa-dev >/dev/null
          git clone -q https://github.com/ButterscotchRunner/Butterscotch bs && git -C bs checkout -q $(cat ci/BUTTERSCOTCH_COMMIT)
          cmake -S bs -B bs/build -DBACKEND=sdl2 -DCMAKE_BUILD_TYPE=Release -DENABLE_FMOD=OFF > /tmp/cmake.log 2>&1 || { tail -40 /tmp/cmake.log; exit 1; }
          cmake --build bs/build -j4 > /tmp/build.log 2>&1 || { grep -E "error" /tmp/build.log | head -30; exit 1; }
          ls -la bs/build/butterscotch
      - name: Run Sunky the Game 2
        env: { LIBGL_ALWAYS_SOFTWARE: "1", SDL_AUDIODRIVER: dummy }
        run: xvfb-run -a -s "-screen 0 1280x960x24" ci/lab-g2.sh bs/build/butterscotch games/g2x/data.win out/g2
      - name: Publish to branch r-g2
        if: always()
        run: |
          [ -d out/g2 ] || exit 0
          cd out/g2 && git init -q -b r-g2 && git add -A
          git -c user.name=lab -c user.email=lab@local commit -qm "g2 ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" r-g2
